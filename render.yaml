services:
  - type: web
    name: coverflow-uat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: UAT_ADMIN_EMAIL
        sync: false
      - key: UAT_ADMIN_PASSCODE
        sync: false
      - key: UAT_BROKER_CODE
        value: "COVERFLOW-UAT"
